<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten real-life AI security cases</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f5f8ff; --surface: #ffffff; --ink: #0e0e0e; --muted: #454f68;
  --blue: #266de8; --blue-text: #1c56c4; --yellow: #ffe629; --soft: #e6eeff;
  --line: #0e0e0e; --shadow: #0e0e0e; --dot: rgba(38, 109, 232, 0.16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1020; --surface: #151c33; --ink: #f5f8ff; --muted: #aeb9d6;
    --blue-text: #8db1ff; --soft: #1d2848; --line: #dfe7ff; --shadow: #2b3a73;
    --dot: rgba(141, 177, 255, 0.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1020; --surface: #151c33; --ink: #f5f8ff; --muted: #aeb9d6;
  --blue-text: #8db1ff; --soft: #1d2848; --line: #dfe7ff; --shadow: #2b3a73;
  --dot: rgba(141, 177, 255, 0.14);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font: 400 17px/1.55 "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background-image: radial-gradient(circle, var(--dot) 2px, transparent 2.6px);
  background-size: 34px 34px;
}
.deco { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.deco i { position: absolute; border-radius: 50%; }
.deco .a { width: 420px; height: 420px; background: var(--yellow); opacity: 0.3; right: -150px; top: -130px; }
.deco .b { width: 540px; height: 540px; background: var(--blue); opacity: 0.14; left: -220px; bottom: -220px; }
h1, h2, h3 { font-family: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; margin: 0; line-height: 1.1; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }

.top { background: var(--blue); border-bottom: 3px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: block; height: 34px; width: auto; }
.top-tag { color: #fff; font-weight: 600; font-size: 15px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 30px 20px 72px; }

/* intro */
.intro { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: stretch; }
.hero { background: var(--surface); border: 3px solid var(--line); border-radius: 26px; box-shadow: 8px 8px 0 var(--shadow); padding: 28px; }
.hero h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 800; letter-spacing: -0.03em; }
.hero p { margin: 14px 0 0; font-size: 19px; max-width: 32em; }
.panel { background: var(--yellow); color: #0e0e0e; border: 3px solid var(--line); border-radius: 26px; box-shadow: 8px 8px 0 var(--shadow); padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.count { font: 800 22px/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
.meter { height: 20px; border: 3px solid #0e0e0e; border-radius: 999px; background: #fff; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--blue); transition: width 0.5s ease; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  cursor: pointer; background: #fff; color: #0e0e0e; border: 3px solid #0e0e0e; border-radius: 14px; padding: 9px 16px;
  font: 800 16px/1.1 "Bricolage Grotesque", system-ui, sans-serif; box-shadow: 4px 4px 0 #0e0e0e; transition: transform 0.12s, box-shadow 0.12s;
}
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #0e0e0e; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #0e0e0e; }
.btn:focus-visible { outline-color: #0e0e0e; }
.done { margin: 24px 0 0; padding: 16px 20px; background: var(--blue); color: #fff; border: 3px solid var(--line); border-radius: 18px; box-shadow: 6px 6px 0 var(--shadow); font: 800 20px/1.3 "Bricolage Grotesque", system-ui, sans-serif; }
.done[hidden] { display: none; }

/* grid and cards */
.grid { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 30px; padding: 0; margin: 34px 0 0; }
.flip { display: flex; perspective: 1500px; }
.inner { position: relative; flex: 1; display: grid; transform-style: preserve-3d; transition: transform 0.75s cubic-bezier(0.25, 0.8, 0.25, 1); }
.flip.flipped .inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; display: flex; flex-direction: column; gap: 10px; padding: 22px;
  border: 3px solid var(--line); border-radius: 26px; box-shadow: 8px 8px 0 var(--shadow);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.front { background: var(--tc); color: #0e0e0e; cursor: pointer; }
.back { background: var(--surface); transform: rotateY(180deg); cursor: pointer; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.team { display: inline-block; background: #0e0e0e; color: #fff; border: 2px solid #0e0e0e; border-radius: 999px; padding: 3px 14px; font-weight: 600; font-size: 15px; line-height: 1.5; }
.caseno { font-weight: 600; font-size: 15px; }
.emoji { font-size: 66px; line-height: 1; margin: 6px 0 0; animation: bob 3.6s ease-in-out infinite; align-self: flex-start; }
.face h2 { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; }
.case { margin: 0; font-size: 18px; flex: 1; }
.fbtn {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 6px;
  background: #0e0e0e; color: #fff; border: 3px solid #0e0e0e; border-radius: 14px; padding: 9px 16px; font-weight: 600; font-size: 16px;
}
.fbtn svg { width: 18px; height: 18px; flex: none; }
.back .fbtn { background: var(--yellow); color: #0e0e0e; border-color: var(--line); }
.fbtn:focus-visible { outline-color: var(--blue); }
.front .fbtn:focus-visible { outline-color: #0e0e0e; }

.verdict { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; border: 3px solid var(--line); border-radius: 999px; padding: 5px 16px 5px 10px; font: 800 18px/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
.verdict svg { width: 26px; height: 26px; flex: none; }
.v-go { background: var(--blue); color: #fff; }
.v-ask { background: var(--yellow); color: #0e0e0e; }
.v-no { background: #ff8f8f; color: #0e0e0e; }
.back h3 { font-size: 21px; font-weight: 800; margin-top: 4px; }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: 16px; line-height: 1.45; }
.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font: 800 15px/1 "Bricolage Grotesque", system-ui, sans-serif; }
.tip { margin: 2px 0 0; padding: 10px 14px; background: var(--soft); border: 2px dashed var(--line); border-radius: 14px; font-weight: 600; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.chips li { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 1px 12px; font-size: 14px; font-weight: 600; }

/* team colors on the front of each card */
.t-hr { --tc: #ffb8d0; } .t-marketing { --tc: #d4c2ff; } .t-support { --tc: #a8ccff; } .t-technical { --tc: #aef0d4; }
.t-operations { --tc: #ffcf99; } .t-cs { --tc: #9fe3e6; } .t-revops { --tc: #ffe629; } .t-infosec { --tc: #c9c9ff; }
.t-finance { --tc: #c9f0a7; } .t-everyone { --tc: #ffadad; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
#confetti i { position: absolute; width: 10px; height: 14px; border-radius: 3px; animation: burst 1.3s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
@keyframes burst { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--dx), calc(var(--dy) + 260px)) rotate(var(--rot)); opacity: 0; } }

@media (max-width: 820px) {
  .intro { grid-template-columns: 1fr; }
  .grid { gap: 26px; }
}
@media (max-width: 480px) {
  .hero, .panel { padding: 20px; }
  .face { padding: 18px; border-radius: 22px; box-shadow: 6px 6px 0 var(--shadow); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .inner, .flip.flipped .inner { transform: none; }
  .face { backface-visibility: visible; -webkit-backface-visibility: visible; }
  .back { transform: none; opacity: 0; visibility: hidden; }
  .flip.flipped .front { opacity: 0; visibility: hidden; }
  .flip.flipped .back { opacity: 1; visibility: visible; }
}
</style>
</head>

    no: '<svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#0e0e0e"/><path d="M8.5 8.5l9 9M17.5 8.5l-9 9" fill="none" stroke="#ff8f8f" stroke-width="3" stroke-linecap="round"/></svg>'
  };
  var FLIP = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8a7 7 0 0 1 12-3.5M17 12a7 7 0 0 1-12 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15.5 1.5v3.5H12M4.5 18.5V15H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var COLORS = ["#266de8", "#ffe629", "#ffb8d0", "#aef0d4", "#d4c2ff", "#ffcf99"];
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var grid = document.getElementById("grid");
  var opened = {};
  var cards = [];

  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) n.className = cls; if (html !== undefined) n.innerHTML = html; return n; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  CASES.forEach(function (c, n) {
    var li = el("li", "flip t-" + c.cls);
    var inner = el("div", "inner");
    var front = el("div", "face front");
    front.innerHTML =
      '<div class="row"><span class="team">' + esc(c.team) + '</span><span class="caseno">Case ' + (n + 1) + '</span></div>' +
      '<div class="emoji" aria-hidden="true">' + c.emoji + '</div>' +
      '<h2>' + esc(c.title) + '</h2>' +
      '<p class="case">' + esc(c.text) + '</p>' +
      '<button class="fbtn" type="button">' + FLIP + 'Flip for the handling</button>';
    var back = el("div", "face back");
    back.innerHTML =
      '<span class="verdict v-' + c.tone + '">' + ICONS[c.tone] + esc(c.verdict) + '</span>' +
      '<h3>How to handle it</h3>' +
      '<ol class="steps">' + c.steps.map(function (s) { return "<li><span>" + esc(s) + "</span></li>"; }).join("") + '</ol>' +
      '<p class="tip">' + esc(c.tip) + '</p>' +
      '<ul class="chips" aria-label="Policy check">' + c.chips.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + '</ul>' +
      '<button class="fbtn" type="button">' + FLIP + 'Back to the case</button>';
    back.setAttribute("aria-hidden", "true"); back.setAttribute("inert", "");
    inner.appendChild(front); inner.appendChild(back); li.appendChild(inner); grid.appendChild(li);
    var card = { n: n, li: li, front: front, back: back, flipped: false };
    cards.push(card);
    li.addEventListener("click", function () { set(card, !card.flipped, true); });
  });

  function set(card, flipped, focus) {
    card.flipped = flipped;
    card.li.classList.toggle("flipped", flipped);
    var show = flipped ? card.back : card.front, hide = flipped ? card.front : card.back;
    show.removeAttribute("aria-hidden"); show.removeAttribute("inert");
    hide.setAttribute("aria-hidden", "true"); hide.setAttribute("inert", "");
    if (flipped && !opened[card.n]) { opened[card.n] = true; progress(); }
    if (focus) { var b = show.querySelector(".fbtn"); if (b) b.focus({ preventScroll: true }); }
  }

  function progress() {
    var k = Object.keys(opened).length;
    document.getElementById("count").textContent = k + " of " + CASES.length + " cases opened";
    document.getElementById("fill").style.width = (k / CASES.length * 100) + "%";
    var done = document.getElementById("done");
    if (k === CASES.length && done.hidden) { done.hidden = false; burst(); }
  }

  function burst() {
    if (reduced) return;
    var box = document.getElementById("confetti"), w = window.innerWidth;
    for (var n = 0; n < 60; n++) {
      var p = document.createElement("i");
      p.style.left = (Math.random() * w) + "px"; p.style.top = "-10px";
      p.style.background = COLORS[n % COLORS.length];
      p.style.setProperty("--dx", (Math.random() * 200 - 100).toFixed(0) + "px");
      p.style.setProperty("--dy", (Math.random() * 380 + 80).toFixed(0) + "px");
      p.style.setProperty("--rot", (Math.random() * 720 - 360).toFixed(0) + "deg");
      box.appendChild(p);
      (function (node) { setTimeout(function () { node.remove(); }, 1500); })(p);
    }
  }

  document.getElementById("showAll").addEventListener("click", function () { cards.forEach(function (c) { set(c, true, false); }); });
  document.getElementById("hideAll").addEventListener("click", function () { cards.forEach(function (c) { set(c, false, false); }); });
  document.getElementById("shuffle").addEventListener("click", function () {
    var order = cards.slice();
    for (var n = order.length - 1; n > 0; n--) { var j = Math.floor(Math.random() * (n + 1)); var t = order[n]; order[n] = order[j]; order[j] = t; }
    order.forEach(function (c) { grid.appendChild(c.li); });
  });
})();
</script>
</body>
</html>
